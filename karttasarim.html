<!DOCTYPE html>
<html lang="en">




<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>karttasarim</title>
    <style>
        /*web sayfasını komple renklendirme body
        kapsamında olduğu için böyle*/
        body {
            background-color: hsl(185, 75%, 39%);
            /*ortalama komutları*/
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .yas {
            font-weight: lighter;
        }

        .kart {

            background-color: white;
            width: 450px;
            border-radius: 30px;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
            padding: 0;
            transform: translateZ(0);

        }


        .picture {
            width: 100;
            display: block;
            width: 100%;
            height: 140%;
            margin: 0;
            padding: 0;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;
            overflow: hidden;
        }

        .picture img {
            width: 100%;
            height: 100%;
            overflow: hidden;
            object-fit: cover;
            border-top-left-radius: 30px;
            border-top-right-radius: 30px;

        }

        .profile {


            height: 90px;
            border-radius: 50%;
            border: 5px solid white;
            position: absolute;
            top: 75px;
            left: 50%;
            top: 30%;
            transform: translateX(-50%)
            
        }

        .bilgiler {
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-top: 1px;
            color: black;
        }

        .bilgiler p {
            margin: 5px;
            font-size: 18px;
            color: #969696;
            letter-spacing: 1px
        }
    </style>

</head>

<body>
    <!---->
    <div class="kart">
        <div class="picture">
            <img src="bg-pattern-card.svg" alt=""> <br>
        </div>

        <div>
            <img class="profile" src="image-victor.jpg" alt=""><br><br>
            <h2>Victor Crest <span class="yas">26</span></h2>
            <p>Üsküdar</p>

        </div>
        

        <div class="bilgiler">
            <div>
                <h3>80K</h3>
                <p>Followers</p>
            </div>
            <div>
                <h3>80.3K</h3>
                <p>Likes</p>
            </div>
            <div>
                <h3>1.4K</h3>
                <p>Photos</p>
            </div>
        </div>
    </div>
    </div>
</body>

</html>
